name: Attach release assets

# Uploads the built APKs from .build/ (committed by the Build APK workflow)
# to the GitHub Release matching the app's versionName. Triggered by pushing
# the v<version> tag after a green build. The sandbox cannot reach
# uploads.github.com, so asset uploads happen from GitHub's own runners.
# Tag-only: the Build APK workflow commits fresh APKs with [skip ci], so a
# branch push would race ahead of the build and attach stale assets. The
# release is published by pushing the v<version> tag after a green build.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach APKs to the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Resolve the release tag: v* tag pushes use the tag; branch pushes
          # derive it from the app version.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
            TAG="v${VER}"
          fi
          echo "Release tag: $TAG"

          ls -la .build/ || true
          test -f .build/MorseLink-release.apk
          test -f .build/MorseLink-debug.apk

          # Find the release (including drafts); publish it if drafted.
          REL_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>/dev/null || true)"
          if [ -n "$REL_ID" ]; then
            echo "Release $TAG exists (id $REL_ID)"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" -f draft=false >/dev/null
          else
            echo "Release $TAG does not exist - creating it"
            printf '%s\n' \
              "MorseLink ${TAG#v} - offline P2P file transfer for Android." \
              "" \
              "No internet, no cloud, no accounts, no ads. Files move directly between two devices." \
              "" \
              "## Downloads" \
              "- **MorseLink-release.apk** - signed release build (recommended)" \
              "- **MorseLink-debug.apk** - debug build with extra logging" \
              "" \
              "Requires Android 5.0+. To install: enable install unknown apps for your browser or file manager when prompted." \
              > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MorseLink ${TAG#v}" --notes-file notes.md
          fi

          gh release upload "$TAG" .build/MorseLink-release.apk .build/MorseLink-debug.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

      - name: Publish failure log to the branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "morselink-builder"
          git config user.email "builder@users.noreply.github.com"
          git fetch origin arena/01a09cc4-morse-link || true
          git checkout --detach FETCH_HEAD 2>/dev/null || true
          mkdir -p .build
          date -u > .build/release-assets-log.txt
          git add .build/release-assets-log.txt
          git commit -m "release-assets failed [skip ci]" || echo "nothing to commit"
          git push origin HEAD:refs/heads/arena/01a09cc4-morse-link || echo "push skipped"
