name: Attach release assets

# Uploads the built APKs from .build/ (committed by the Build APK workflow)
# to an existing GitHub Release. Run manually with a tag, or automatically
# when a v* tag is pushed. The sandbox cannot reach uploads.github.com, so
# asset uploads happen from GitHub's own runners.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify artifacts exist
        run: |
          test -f .build/MorseLink-release.apk || { echo "::error::missing .build/MorseLink-release.apk"; exit 1; }
          test -f .build/MorseLink-debug.apk || { echo "::error::missing .build/MorseLink-debug.apk"; exit 1; }
          ls -la .build/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if missing, then upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            echo "Release $TAG does not exist — creating it"
            cat > notes.md <<'NOTES'
            MorseLink — offline P2P file transfer for Android.

            No internet, no cloud, no accounts, no ads. Files move directly between two devices.

            ## Downloads
            - **MorseLink-release.apk** — signed release build (recommended)
            - **MorseLink-debug.apk** — debug build with extra logging

            Requires Android 5.0+. To install: enable "install unknown apps" for your browser/file manager when prompted.

            ## Features
            - Radar pairing with explicit Accept/Reject consent; Nearby Connections + LAN Wi-Fi transports with exact-offset resume
            - Photos / Videos / Music / Apps / Files picker, queue with per-file pause/resume/cancel/retry, conflict resolution, restart-recovery journal
            - WebShare: manage files from any browser via QR (token auth, resumable uploads, Range downloads)
            - History, Settings, Connection Doctor, Help/FAQ, in-app log + crash reports with one-tap .txt export
            NOTES
            gh release create "$TAG" --verify-tag --title "MorseLink ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" \
            .build/MorseLink-release.apk \
            .build/MorseLink-debug.apk \
            --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
