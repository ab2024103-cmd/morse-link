name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The legacy "tools" package was removed from Google's SDK repository
      # (sdkmanager: "Failed to find package 'tools'"), so only platform-tools
      # is requested — everything else Gradle needs is installed below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Collect results
        if: always()
        run: |
          mkdir -p .build
          cp -f build-log.txt .build/ 2>/dev/null || echo "no build log produced" > .build/build-log.txt
          echo "" >> .build/build-log.txt
          echo "=== JOB CONCLUSION: ${{ job.status }} ===" >> .build/build-log.txt
          if ls app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1; then
            rm -f .build/*.apk
            cp app/build/outputs/apk/debug/app-debug.apk .build/MorseLink-debug.apk
            cp app/build/outputs/apk/release/app-release.apk .build/MorseLink-release.apk
            echo "APK_SIZE_DEBUG=$(stat -c%s .build/MorseLink-debug.apk)" >> .build/build-log.txt
            echo "APK_SIZE_RELEASE=$(stat -c%s .build/MorseLink-release.apk)" >> .build/build-log.txt
          else
            echo "NO_APK_PRODUCED" >> .build/build-log.txt
          fi

      # Publishes the release from this same runner: the freshly built APKs are
      # already present, so no separate tag-triggered workflow is needed (tag
      # pushes do not reliably trigger workflows that are absent from the
      # default branch).
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f .build/MorseLink-release.apk
          test -f .build/MorseLink-debug.apk
          VER="$(grep -oP 'versionName = "\K[^\"]+' app/build.gradle.kts)"
          TAG="v${VER}"
          echo "Release tag: $TAG"
          REL_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>/dev/null </dev/null || true)"
          # A 404 response body would otherwise be captured as a non-numeric id.
          REL_ID="${REL_ID//[!0-9]/}"
          if [ -n "$REL_ID" ]; then
            echo "Release $TAG exists (id $REL_ID)"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" -f draft=false >/dev/null
          else
            echo "Release $TAG does not exist - creating it"
            printf '%s\n' \
              "MorseLink ${TAG#v} - offline P2P file transfer for Android." \
              "" \
              "No internet, no cloud, no accounts, no ads. Files move directly between two devices." \
              "" \
              "## Downloads" \
              "- **MorseLink-release.apk** - signed release build (recommended)" \
              "- **MorseLink-debug.apk** - debug build with extra logging" \
              "" \
              "Requires Android 5.0+. To install: enable install unknown apps for your browser or file manager when prompted." \
              > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MorseLink ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" .build/MorseLink-release.apk .build/MorseLink-debug.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "asset: \(.name) \(.size) bytes"'

      - name: Commit results
        if: always()
        run: |
          git config user.name "morselink-builder"
          git config user.email "builder@users.noreply.github.com"
          git add .build
          git commit -m "Build artifacts (auto) [skip ci]" || echo "nothing to commit"
          git push
